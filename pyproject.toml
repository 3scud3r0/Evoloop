[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoloop"
version = "0.4.0"
description = "Assistente local, seguro e evolutivo para modelos OpenAI-compatible"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Evoloop contributors"}]
keywords = ["agents", "local-llm", "ollama", "evolution", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
chroma = ["chromadb>=1"]
dev = ["build>=1"]

[project.scripts]
evoloop = "evoloop.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evoloop*", "third_party*"]
namespaces = true

[tool.setuptools.package-data]
evoloop = ["web/*.html"]
